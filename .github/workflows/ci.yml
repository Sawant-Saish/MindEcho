name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint --workspace=@lector/api

      - name: Test API
        run: npm test --workspace=@lector/api

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
